<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>الفرق بين المنشآت الصناعية وغير الصناعية</title>
    <script>
      // Single-page app on GitHub Pages: any unknown URL is served by this file.
      // Store the original path, then load the app root so the app can restore the route.
      try {
        // Normalize: strip trailing slash so "/calculators/" becomes "/calculators"
        var path = location.pathname.replace(/^\/industrial-labor-guide/, "").replace(/\/$/, "");
        sessionStorage.setItem("spa_restore_path", path || "/");
        sessionStorage.setItem("spa_restore_search", location.search || "");
      } catch (e) { /* ignore storage errors */ }
      location.replace("/industrial-labor-guide/");
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: Cairo, sans-serif; background: #faf7f0; color: #1c2b3a; }
      .card { text-align: center; padding: 2.5rem 3rem; background: #fff; border: 1px solid #e5dfd2; border-radius: 1rem; box-shadow: 0 2px 12px rgba(28,43,58,.06); }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      p { margin: 0; color: #5d6b7a; }
      a { color: #1e6f5c; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>جاري التحميل...</h1>
      <p>إن لم يتم التحويل تلقائياً، انتقل إلى <a href="/industrial-labor-guide/">الصفحة الرئيسية</a></p>
    </div>
  </body>
</html>
